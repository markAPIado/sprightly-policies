<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprightly Policies</title>
  <meta name="description" content="Policies for Sprightly, the interval-walking app by Mark Apiado.">
  <style>
    :root { --bg: #F7F9F8; --text: #18211D; --weak: #4D5A54; --brand: #0B7A4B; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0F1412; --text: #E6EEEA; --weak: #A6B3AD; --brand: #34D399; color-scheme: dark; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 68ch; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font-size: 1.7rem; margin: 0 0 1rem; }
    p { color: var(--weak); }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <h1>Sprightly policies</h1>
    <p>Sprightly is an interval-walking timer for Android by Mark Apiado.</p>
    <ul>
      <li><a href="privacy/">Privacy Policy</a></li>
    </ul>
  </main>
</body>
</html>
